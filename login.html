<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Fazendinha Online</title>

<base href="/">

<link rel="stylesheet" href="style.css?v=5.0.1">

</head>

<body onload="setLoginBackground()">

<div class="login-card login-layout" id="card-login">

    <img src="assets/logo_fazendinha_online.png"
         alt="Logo da Fazendinha Online"
         class="login-logo">

    <div class="input-container">
        <input 
            type="text" 
            id="login-user"
            placeholder="Login"
            autocomplete="username"
            aria-label="UsuÃ¡rio"
            required
            >

        <input 
            type="password"
            id="login-pass"
            placeholder="Senha"
            autocomplete="current-password"
            aria-label="Senha"
            required>
    </div>

    <button id="login-btn" class="login-main-btn">
        Entrar
    </button>

    <div class="additional-buttons">
        <button id="create-account-btn">Criar Conta</button>
        <button id="recover-account-btn">Recuperar Conta</button>
    </div>

</div>

<div class="login-card login-layout" id="card-register">
    <img src="assets/logo_fazendinha_online.png"
         alt="Logo"
         class="login-logo">

    <div class="input-container">
        <input type="text" id="reg-user" placeholder="Login">

    <input type="email" id="reg-email" placeholder="E-mail">

    <input type="email" id="reg-email-conf" placeholder="Confirmar E-mail">

    <input type="password" id="reg-pass" placeholder="Senha">

    <input type="password" id="reg-pass-conf" placeholder="Confirmar Senha"></div>

    <div class="additional-buttons">

    <button id="register-btn" class="login-style-btn">
        Cadastrar
    </button>

    <button id="back-login-register">
        Cancelar
    </button>

</div>
</div>


<div class="login-card login-layout" id="card-recover">
    <img src="assets/logo_fazendinha_online.png" alt="Logo" class="login-logo">

    <input type="text" id="rec-user" placeholder="Login">

    <input type="email" id="rec-email" placeholder="E-mail">

    <div class="additional-buttons">

    <button id="recover-btn" class="login-style-btn">
        Solicitar
    </button>

    <button id="back-login-recover">
        Cancelar
    </button>

</div>
</div>

<div class="login-card login-layout" id="card-reset">
    <img src="assets/logo_fazendinha_online.png" alt="Logo" class="login-logo">

    <input 
        type="password" 
        id="reset-pass" 
        placeholder="Nova senha">

    <input 
        type="password" 
        id="reset-pass-conf" 
        placeholder="Confirmar nova senha">

    <div class="additional-buttons">

        <button id="reset-btn" class="login-style-btn">
            Confirmar
        </button>

        <button id="back-login-reset">
            Cancelar
        </button>

    </div>
</div>

<script src="login_auth.js"></script>
</body>
</html>
